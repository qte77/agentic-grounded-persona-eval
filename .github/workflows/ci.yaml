name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run pytest -q
      - name: verify sourcing on any tracked findings files
        run: |
          shopt -s nullglob
          files=(findings/*-findings.md)
          if [ ${#files[@]} -gt 0 ]; then
            uv run python scripts/verify_sourcing.py "${files[@]}"
          else
            echo "no findings/*-findings.md tracked here, skipping"
          fi
