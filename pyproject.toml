[project]
name = "agentic-grounded-persona-eval"
version = "0.1.0"
description = "A reusable, product-agnostic method for testing whether a product works for its ICP — grounded in real evidence, not invented personas."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
